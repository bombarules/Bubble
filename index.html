.hint{position:absolute;left:8px;right:52px;bottom:22px;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--ink);z-index:3}

.it{border-bottom:1px solid var(--line)}

.it.open{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 14%,transparent),transparent)}
.it.open .hd{padding-bottom:4px}
.dt{padding:0 16px 12px 40px}
.addr{color:var(--ink);margin:0;font-size:14px}.est{margin:0 0 6px;font-size:13px;color:var(--mut)}
